name: CI

# Los hooks cambian el comportamiento de todas las sesiones en todas las máquinas, así que se
# tratan como código: lint y tests en cada PR y en cada push a main. La suite es offline y crea
# repos git temporales; no toca nada de la máquina.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Hooks (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check hooks
      - run: pytest -q hooks/tests
